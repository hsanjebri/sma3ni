[project]
name = "sma3ni-ml"
version = "0.1.0"
description = "Benchmark, fine-tune and export Tunisian Darija speech models"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

# Heavy model/runtime deps are optional so `uv sync && uv run pytest` stays fast
# and CPU-only. Real benchmark runs need: uv sync --extra asr
[project.optional-dependencies]
asr = [
    "faster-whisper>=1.0",
    "transformers>=4.44",
    "torch>=2.3",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sma3ni_ml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001-003: "ambiguous unicode character". Arabic letters and Arabic
# punctuation are the subject matter here, not a typo for a Latin lookalike.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs a real model download or GPU (deselect with '-m \"not slow\"')",
]
