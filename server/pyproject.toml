[project]
name = "sma3ni-server"
version = "0.1.0"
description = "Sma3ni inference API: Tunisian Darija voice notes to text"
license = "Apache-2.0"
authors = [{ name = "Hsan Jebri" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sma3ni-ml",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# An application, not a library: run from the checkout, never built or installed.
package = false
# `uv sync` installs both groups for development. The image skips them unless
# built with ASR_LOCAL=1: with ASR_BACKEND=groq the server needs no local model.
default-groups = ["dev", "local"]

[tool.uv.sources]
sma3ni-ml = { path = "../ml", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Slow tests load a real model; CI and the default run skip them: `pytest -m slow`.
addopts = ["-m", "not slow"]
markers = ["slow: loads a real Whisper model (downloads it on first run)"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
local = [
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
]
