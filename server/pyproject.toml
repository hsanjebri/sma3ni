[project]
name = "sma3ni-server"
version = "0.1.0"
description = "Sma3ni inference API: Tunisian Darija voice notes to text"
license = "Apache-2.0"
authors = [{ name = "Hsan Jebri" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# An application, not a library: run from the checkout, never built or installed.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
