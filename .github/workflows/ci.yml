name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml:
    name: ml (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ml/uv.lock

      # Core deps only, no `--extra asr`: the suite must stay CPU-only and fast.
      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
