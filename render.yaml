# Render Blueprint: the free MVP host for the API (docs/ARCHITECTURE.md).
# Render builds server/Dockerfile from the repo root and redeploys on every push
# to the connected branch that touches the server or ml code.
services:
  - type: web
    name: sma3ni-api
    runtime: docker
    plan: free
    region: frankfurt # the closest region to Tunisia
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    # Deploy a pushed commit only once its GitHub checks (CI) pass.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - server/**
        - ml/**
      ignoredPaths:
        - server/tests/**
        - ml/tests/**
        - "**/*.md"
    envVars:
      - key: ASR_BACKEND
        value: groq
      - key: MODEL_VERSION
        value: groq-whisper-large-v3-turbo
      # Groq does the heavy work, so a few transcriptions can run at once.
      - key: ASR_CONCURRENCY
        value: "4"
      # Generated by Render once and never shown here. Regenerating it logs
      # every install out (they get a 401 and re-install).
      - key: TOKEN_SECRET
        generateValue: true
      # Asked for when the Blueprint is created; set in the dashboard, never here.
      - key: GROQ_API_KEY
        sync: false
